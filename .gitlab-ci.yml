image: ubuntu:latest  # Base image for setup and testing stages

stages:
  - setup
  - test
  - sonar

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

# Setup and Testing Steps
before_script:
  # Install necessary system packages
  - apt-get update
  - apt-get install -y git python3-pip python3-dev python3-venv autoconf libssl-dev libxml2-dev libxslt1-dev libjpeg-dev libffi-dev libudev-dev zlib1g-dev pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev ffmpeg libgammu-dev

  # Run the setup script to create the virtual environment and install dependencies
  - script/setup

  # Activate the virtual environment and install dependencies
  - source venv/bin/activate
  - pip install --upgrade pip
  - pip install -r requirements_all.txt 
  - pip install -r requirements_test_all.txt

# Testing stage
test:
  stage: test
  script:
    - source venv/bin/activate
    - pytest ./tests/components/remember_the_milk/ --cov=homeassistant.components.remember_the_milk --cov-report term-missing -vv
  allow_failure: false
  only:
    - merge_requests
    - bugFixes

# SonarQube Analysis stage
sonarcloud-check:
  stage: sonar
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - bugFixes
