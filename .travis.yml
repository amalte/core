os: linux
dist: focal
language: python
python:
  - "3.12"  # Specify Python version if needed

# Define the stages
stages:
  - setup
  - test
  - sonar

# Global variables
env:
  global:
    - SONAR_USER_HOME=${TRAVIS_BUILD_DIR}/.sonar  # Defines the location of the analysis task cache
    - GIT_DEPTH=0  # Tells git to fetch all branches of the project, required by the analysis task

# Base setup for all stages
before_install:
  - sudo apt-get update
  - sudo apt-get install -y git python3-pip python3-dev python3-venv autoconf libssl-dev libxml2-dev libxslt1-dev libjpeg-dev libffi-dev libudev-dev zlib1g-dev pkg-config libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libavfilter-dev ffmpeg libgammu-dev

# Setup stage
setup:
  stage: setup
  script:
    - ./script/setup  # Run setup script to create virtual environment and install dependencies
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements_all.txt 
    - pip install -r requirements_test_all.txt

# Testing stage
test:
  stage: test
  script:
    - source venv/bin/activate
    - pytest ./tests/components/remember_the_milk/ --cov=homeassistant.components.remember_the_milk --cov-report term-missing -vv
  allow_failures: false

# SonarQube Analysis stage
sonarcloud-check:
  stage: sonar
  addons:
    sonarcloud:
      organization: "amalte"
  script:
    # Other script steps might be done before running the analysis if needed
    - sonar-scanner -Dsonar.login=${SONAR_TOKEN}
